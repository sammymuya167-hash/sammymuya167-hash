name: RouteForgeShop
options:
  bundleIdPrefix: app.shadownet.routeforge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RouteForgeShop:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shadownet.routeforge.customer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - RouteForgeShopTests
        - RouteForgeShopUITests
      gatherCoverageData: true
  RouteForgeShopTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: RouteForgeShop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RouteForgeShopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: RouteForgeShop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
