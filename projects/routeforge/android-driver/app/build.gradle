plugins { id 'com.android.application' }
android {
 namespace 'app.shadownet.routeforge.driver'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'app.shadownet.routeforge.rider'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.7-rider'; testInstrumentationRunner 'app.shadownet.routeforge.driver.QueueInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}
dependencies { implementation project(':brouter-engine'); implementation 'org.mapsforge:mapsforge-map-android:0.25.0'; implementation 'org.mapsforge:mapsforge-map-reader:0.25.0'; testImplementation 'junit:junit:4.13.2' }
