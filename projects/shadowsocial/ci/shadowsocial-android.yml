name: ShadowSocial Native Android
on:
  push:
    branches: [main]
    paths: ["projects/shadowsocial/native/**", "projects/shadowsocial/lib/**", ".github/workflows/shadowsocial-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/shadowsocial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.32.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check APIs
        run: |
          corepack pnpm typecheck
          corepack pnpm test
          node tests/password-auth.mjs
          node tests/rtc.mjs
          node tests/android-updates.mjs
      - name: Check native app
        run: |
          cd native
          flutter create --platforms=android --org ke.co.shadownet --project-name shadowsocial .
          python3 tool/prepare_android.py
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver
          flutter analyze
          flutter test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start real local API
        run: |
          node native/tool/test-server.mjs > /tmp/shadowsocial-test-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:8787/api/me >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/api/me >/dev/null
      - name: Test real native Android flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: projects/shadowsocial/native
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart
      - name: Build native release
        run: |
          cd native
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter build apk --release
      - name: Prepare privately signed release input
        run: |
          mkdir -p native/release
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 native/build/app/outputs/flutter-apk/app-release.apk native/release/shadowsocial-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" native/release/
          git rev-parse HEAD > native/release/source-sha.txt
          find native/lib native/android/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > native/release/source-manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadowsocial-native-android
          path: |
            projects/shadowsocial/native/release/
            projects/shadowsocial/native/screenshots/
          retention-days: 14
