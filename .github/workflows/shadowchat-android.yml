name: ShadowChat Android APK
on:
  push:
    branches: [main]
    paths: ["projects/shadowchat/android/**", ".github/workflows/shadowchat-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/shadowchat/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: "platform-tools emulator platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compile, lint and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android launch and shared browser session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: projects/shadowchat/android
          script: gradle :app:connectedDebugAndroidTest
      - name: Prepare unsigned release for private owner signing
        run: |
          mkdir -p release
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk release/shadowchat-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/NOTICE.txt" release/sdk-tool-NOTICE.txt
          git rev-parse HEAD > release/source-sha.txt
          find app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > release/source-manifest.sha256
          sha256sum app/build.gradle build.gradle settings.gradle >> release/source-manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadowchat-android-release
          path: |
            projects/shadowchat/android/release/
            projects/shadowchat/android/app/build/reports/tests/
            projects/shadowchat/android/app/build/reports/androidTests/
            projects/shadowchat/android/app/build/reports/lint-results-*.html
          retention-days: 14
