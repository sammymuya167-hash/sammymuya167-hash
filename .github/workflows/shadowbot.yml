name: ShadowBot verification
on:
  push:
    paths: ['projects/shadowbot/**', '.github/workflows/shadowbot.yml']
  pull_request:
    paths: ['projects/shadowbot/**', '.github/workflows/shadowbot.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/shadowbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
