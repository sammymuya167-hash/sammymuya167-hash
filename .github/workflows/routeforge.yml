name: RouteForge checks

on:
  push:
    branches: [main]
    paths: ["projects/routeforge/**", ".github/workflows/routeforge.yml"]
  pull_request:
    paths: ["projects/routeforge/**", ".github/workflows/routeforge.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/routeforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: projects/routeforge/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:integration

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/routeforge/android-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: "platform-tools emulator"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for the disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline queue on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: projects/routeforge/android-driver
          script: gradle :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routeforge-android-pilot
          path: |
            projects/routeforge/android-driver/app/build/outputs/apk/debug/app-debug.apk
            projects/routeforge/android-driver/app/build/reports/androidTests/
          retention-days: 14
