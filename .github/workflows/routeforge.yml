name: RouteForge checks

on:
  push:
    branches: [main]
    paths: ["projects/routeforge/**", ".github/workflows/routeforge.yml"]
  pull_request:
    paths: ["projects/routeforge/**", ".github/workflows/routeforge.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/routeforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: projects/routeforge/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:integration
