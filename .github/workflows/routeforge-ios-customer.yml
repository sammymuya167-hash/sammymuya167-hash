name: RouteForge customer iOS
on:
  push:
    branches: [routeforge-ios-customer-1-0]
    paths: ["projects/routeforge/ios-customer/**", ".github/workflows/routeforge-ios-customer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-ios:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/routeforge/ios-customer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing customer iOS project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          mkdir -p build/release
          xcodegen --version > build/release/toolchain.txt
          xcodebuild -version >> build/release/toolchain.txt
          xcodegen generate --spec project.yml
          git rev-parse HEAD > build/release/source-sha.txt
          find Sources Tests UITests Assets.xcassets Info.plist PrivacyInfo.xcprivacy project.yml README.md .gitignore -type f -print0 | sort -z | xargs -0 shasum -a 256 > build/release/source-manifest.sha256
          cp README.md build/release/iOS-handoff.md
      - name: Compile device archive without distribution credentials
        run: |
          set -o pipefail
          xcodebuild archive -project RouteForgeShop.xcodeproj -scheme RouteForgeShop -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/RouteForgeShop-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO | tee build/release/device-build.log
          ditto -c -k --keepParent build/RouteForgeShop-unsigned.xcarchive build/release/RouteForge-Customer-1.0-unsigned-device-archive.zip
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > build/simulators.json
          python3 - <<'PY'
          import json, os
          with open('build/simulators.json') as f:
              runtimes = json.load(f)['devices']
          import re
          keys = sorted(runtimes, key=lambda s: tuple(map(int, re.findall(r'\d+', s))), reverse=True)
          # Reuse the iOS 26.4 runtime that successfully ran the live catalog checks.
          keys = sorted(keys, key=lambda s: not s.endswith('iOS-26-4'))
          devices = [d for k in keys for d in runtimes[k] if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No iPhone simulator is available')
          device = next((d for d in devices if 'Pro' in d['name']), devices[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ROUTEFORGE_SIMULATOR_ID=' + device['udid'] + '\n')
          print('Testing on ' + device['name'])
          PY
      - name: Build signed simulator test application
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project RouteForgeShop.xcodeproj -scheme RouteForgeShop -configuration Debug -destination "platform=iOS Simulator,id=$ROUTEFORGE_SIMULATOR_ID" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee build/release/simulator-build.log
          ditto -c -k --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/RouteForgeShop.app build/release/RouteForge-Customer-1.0-simulator.zip
      - name: Verify customer API sessions and offline recovery
        run: |
          set -o pipefail
          xcodebuild test-without-building -project RouteForgeShop.xcodeproj -scheme RouteForgeShop -configuration Debug -destination "platform=iOS Simulator,id=$ROUTEFORGE_SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/CustomerCoreTests.xcresult -only-testing:RouteForgeShopTests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee build/release/core-tests.log
          xcrun xcresulttool get test-results summary --path build/CustomerCoreTests.xcresult --format json > build/release/core-test-results.json
      - name: Verify native iPhone screens and live shop
        run: |
          set -o pipefail
          xcodebuild test-without-building -project RouteForgeShop.xcodeproj -scheme RouteForgeShop -configuration Debug -destination "platform=iOS Simulator,id=$ROUTEFORGE_SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/CustomerUITests.xcresult -only-testing:RouteForgeShopUITests -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee build/release/ui-tests.log
          xcrun xcresulttool get test-results summary --path build/CustomerUITests.xcresult --format json > build/release/ui-test-results.json
          shasum -a 256 build/release/*.zip > build/release/binary-checksums.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routeforge-customer-ios-build
          path: |
            projects/routeforge/ios-customer/build/release/
            projects/routeforge/ios-customer/build/CustomerCoreTests.xcresult/
            projects/routeforge/ios-customer/build/CustomerUITests.xcresult/
          retention-days: 14
